<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ninedarter</title>
  <meta name="description" content="ninedarter — Material 3 Expressive dart skor uygulaması: X01, Cricket, antrenman modları, botlar ve detaylı istatistikler." />
  <meta name="theme-color" content="#f6f4fb" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Apply the saved theme before the first paint (avoids a dark/light flash on load)
    try {
      var s = JSON.parse(localStorage.getItem('ninedarter:v1') || '{}').settings || {};
      if (s.theme && s.theme !== 'system') document.documentElement.setAttribute('data-theme', s.theme);
      if (s.hue != null) document.documentElement.style.setProperty('--h', s.hue);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>ninedarter JavaScript gerektirir / requires JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
  <script>
    // Safety net: if a file failed to load (e.g. a temporary server error) show a reload button instead of a blank page.
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && !app.children.length) {
        var tr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
        app.innerHTML = '<div style="min-height:100dvh;display:grid;place-items:center;font-family:system-ui;padding:24px;text-align:center">' +
          '<div><p style="font-size:18px;margin:0 0 16px">' + (tr ? 'Uygulama yüklenemedi.' : 'The app could not load.') + '</p>' +
          '<button onclick="location.reload()" style="font:inherit;font-size:16px;padding:12px 28px;border:0;border-radius:24px;background:#5b3fc4;color:#fff;cursor:pointer">' + (tr ? 'Yenile' : 'Reload') + '</button></div></div>';
      }
    }, 8000);
  </script>
</body>
</html>
